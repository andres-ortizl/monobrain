<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>monobrain — logo variants</title>
<style>
  :root{ --accent:#5b5bd6; --ink:#18181b; --paper:#fafaf9; --muted:#8a8a94;
         --dk-bg:#161619; --dk-ink:#e8e8ec; --line:#e6e6e3; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
        color:var(--ink); background:var(--paper); padding:40px 32px 80px; }
  h1{ font-size:18px; font-weight:560; letter-spacing:-.02em; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin:0 0 32px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; max-width:1100px; }
  .card{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
  .cap{ display:flex; align-items:baseline; gap:8px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .cap .n{ font-size:12px; font-weight:560; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); }
  .cap .d{ font-size:12px; color:var(--muted); }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; }
  .tile{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px 16px; }
  .tile.lt{ background:var(--paper); color:var(--ink); }
  .tile.dk{ background:var(--dk-bg); color:var(--dk-ink); }
  .mark{ width:54px; height:54px; }
  .mark svg{ width:100%; height:100%; display:block; }
  .word{ font-size:17px; font-weight:560; letter-spacing:-.025em; }
  .word b{ font-weight:560; }
  .word .m{ opacity:.55; }
</style>
</head>
<body>
  <h1>monobrain — logo variants</h1>
  <p class="sub">8 directions · each on light + dark · code-native memory, one shared brain. Accent <code>#5b5bd6</code> (swap freely).</p>
  <div class="grid" id="grid"></div>

<script>
const A = 'var(--accent)';
// each mark: 64×64 viewBox; currentColor = ink (flips per tile), accent stays accent.
const VARIANTS = [
  ["mesh", "connected nodes — the memory network",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M32 21 L20 42 M32 21 L44 42 M20 42 L44 42"/>
      <circle cx="20" cy="43" r="4.2"/><circle cx="44" cy="43" r="4.2"/>
      <circle cx="32" cy="20" r="5.4" fill="${A}" stroke="none"/>
    </svg>`],

  ["core", "one shared brain, agents in orbit",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="32" cy="32" r="20" stroke-dasharray="2 5" opacity=".5"/>
      <circle cx="32" cy="32" r="8.5" fill="${A}" stroke="none"/>
      <circle cx="52" cy="32" r="3.4" fill="currentColor" stroke="none"/>
      <circle cx="22" cy="14.5" r="3.4" fill="currentColor" stroke="none"/>
      <circle cx="18" cy="46" r="3.4" fill="currentColor" stroke="none"/>
    </svg>`],

  ["anchor", "memory anchored to the code (the moat)",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="16" r="5.5" fill="${A}" stroke="none"/>
      <path d="M32 22 V48"/>
      <path d="M20 36 a12 12 0 0 0 24 0"/>
      <path d="M24 30 h-7 M40 30 h7"/>
    </svg>`],

  ["strata", "tiered memory — L0 · L1 · L2",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <rect x="16" y="38" width="32" height="10" rx="3"/>
      <rect x="20" y="26" width="24" height="10" rx="3"/>
      <rect x="24" y="14" width="16" height="10" rx="3" fill="${A}" stroke="none"/>
    </svg>`],

  ["monogram", "geometric m — mono",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 46 V24 a6 6 0 0 1 12 0 V46 M28 27 a6 6 0 0 1 12 0 V46"/>
      <circle cx="44" cy="22" r="3.6" fill="${A}" stroke="none"/>
    </svg>`],

  ["cell", "a brain cell / storage hex",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <path d="M32 10 L51 21 V43 L32 54 L13 43 V21 Z"/>
      <path d="M32 27 L24 39 M32 27 L40 39 M24 39 L40 39"/>
      <circle cx="32" cy="26" r="3.6" fill="${A}" stroke="none"/>
    </svg>`],

  ["synapse", "two nodes, one connection that strengthens",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <circle cx="17" cy="32" r="6"/>
      <circle cx="47" cy="32" r="6" fill="${A}" stroke="none"/>
      <path d="M23 32 h7 M34 32 h7"/>
      <path d="M32 27.5 V36.5" stroke="${A}"/>
    </svg>`],

  ["rings", "retrieval radius — concentric tiers",
   `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="32" cy="32" r="20" opacity=".35"/>
      <circle cx="32" cy="32" r="13" opacity=".65"/>
      <circle cx="32" cy="32" r="6" fill="${A}" stroke="none"/>
    </svg>`],
];

const word = `<span class="word"><span class="m">mono</span><b>brain</b></span>`;
const grid = document.getElementById("grid");
for (const [n, d, svg] of VARIANTS){
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML =
    `<div class="cap"><span class="n">${n}</span><span class="d">${d}</span></div>
     <div class="tiles">
       <div class="tile lt"><span class="mark">${svg}</span>${word}</div>
       <div class="tile dk"><span class="mark">${svg}</span>${word}</div>
     </div>`;
  grid.appendChild(card);
}
</script>
</body>
</html>
