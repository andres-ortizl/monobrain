name: monobrain

services:
  core:
    build: .
    command: uv run uvicorn monobrain.core.app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [db]

  worker:
    build: .
    command: uv run uvicorn monobrain.worker.app:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    volumes:
      - lance:/data/lance   # LanceDB search index (rebuildable)
      - repos:/data/repos   # repo clone cache (rebuildable)
    depends_on: [db]

  # Solo tier runs libSQL embedded (no container). This is the multi-container
  # dev/team stack, so it uses Postgres — a libSQL file shared across containers
  # isn't safe. See ARCHITECTURE.md §10 (libSQL/Turso vs Postgres).
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: monobrain
      POSTGRES_PASSWORD: monobrain
      POSTGRES_DB: monobrain
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  lance:
  repos:
  pgdata:
