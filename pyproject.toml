[project]
name = "monobrain"
version = "0.1.0"
description = "Code-native memory + curator for coding agents — one shared brain."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
core = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2", "alembic>=1.13", "aiosqlite>=0.20"]
worker = ["litestar>=2", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
# worker (later): lancedb, deepagents, an embedding-model client
# postgres scale-up drivers: asyncpg (app) + psycopg (alembic)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monobrain"]
