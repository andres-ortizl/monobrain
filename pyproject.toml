[project]
name = "monobrain"
version = "0.1.0"
description = "Code-native memory + curator for coding agents — one shared brain."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
core = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
worker = ["litestar>=2", "uvicorn[standard]>=0.30"]
# worker (later): lancedb, deepagents, an embedding-model client, libsql/sqlalchemy

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monobrain"]
